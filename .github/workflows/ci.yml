name: GradTrack CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  java-tests:

    name: Java Build and Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Display Java version
        run: java -version

      - name: Build and run Java tests
        run: mvn --batch-mode clean verify


  playwright-tests:

    name: C# Playwright End-to-End Tests

    runs-on: ubuntu-latest

    needs:
      - java-tests

    services:

      postgres:

        image: postgres:18

        env:
          POSTGRES_DB: gradtrack
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d gradtrack"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore C# dependencies
        working-directory: automation/GradTrack.AutomationTests
        run: dotnet restore

      - name: Build C# automation project
        working-directory: automation/GradTrack.AutomationTests
        run: dotnet build --no-restore

      - name: Install Playwright Chromium
        working-directory: automation/GradTrack.AutomationTests
        run: |
          pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps chromium

      - name: Start GradTrack application
        env:
          DB_URL: jdbc:postgresql://localhost:5432/gradtrack
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          nohup mvn spring-boot:run > gradtrack.log 2>&1 &
          echo $! > gradtrack.pid

      - name: Wait for GradTrack to start
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080 > /dev/null; then
              echo "GradTrack is running."
              exit 0
            fi

            echo "Waiting for GradTrack..."
            sleep 2
          done

          echo "GradTrack failed to start."
          cat gradtrack.log
          exit 1

      - name: Run Playwright end-to-end tests
        working-directory: automation/GradTrack.AutomationTests
        env:
          HEADED: "0"
        run: dotnet test --no-build

      - name: Show GradTrack logs if tests fail
        if: failure()
        run: cat gradtrack.log